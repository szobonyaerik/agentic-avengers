# no-mistakes repo configuration.
#
# Deliberate divergence, scoped to this gate only: the pipeline agent is Anthropic, the same family
# as the avenger implementers. no-mistakes is a *separate* gate that runs in the daemon's own
# disposable worktree with no shared context with the stage that wrote the code, so it decorrelates
# context even though it does not decorrelate model family. The per-phase gates - fidelity,
# spec-review, verifier - keep their cross-family invariant untouched (see
# skills/pipeline-conventions/SKILL.md, "Gates"). Pinned explicitly rather than left on `auto` so
# the choice is a decision on the record, not whatever happens to be on PATH.
agent: claude

commands:
  # Deterministic local baseline. Kept targeted on purpose - remote CI owns broad regression.
  # `pre-commit run --all-files` is deliberately NOT used here: its only hook shells out to
  # scripts/gate_ci.sh, which re-runs the whole suite that `test` below already covers.
  lint: "ruff check ."
  test: "bash scripts/gate_ci.sh"
