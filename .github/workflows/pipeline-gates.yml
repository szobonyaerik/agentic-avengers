name: pipeline-gates
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required — the mutation gate diff-scopes via `git merge-base HEAD <base>`,
      # and the default shallow clone has no merge-base, which silently falls back to mutating the
      # entire module-path (correct, but slow and it re-mutates every earlier phase).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and project deps
        # ruff is PINNED, and that is the gate's verdict being reproducible rather than a
        # preference. An unpinned install put ruff 0.16.4 on this runner against 0.15.5 on the
        # authors' machines: 0.16 both widened the default rule set (506 findings over a tree that
        # is clean on 0.15) and dropped the `Would reformat:` line that lint_gate.py parses to name
        # a drifted file - so the format dimension reported CLEAN while seeing nothing, which is the
        # exact class issue #69 exists to remove. A bump is a deliberate edit here, and
        # tests/test_lint_gate.py goes red on the day it stops being safe.
        run: |
          pip install pytest cosmic-ray "ruff==0.15.5"
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f pyproject.toml ] && pip install -e . || true

      - name: Run pipeline gates (full)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GATE_PROVIDER: openrouter
          AUTHOR_FAMILY: anthropic
          # Mutation gate threshold. Override repo-wide with the MUTATION_MIN_SCORE variable.
          MUTATION_MIN_SCORE: ${{ vars.MUTATION_MIN_SCORE || '0.85' }}
          # Scope mutants to this PR's diff; on a push to main there is no PR base, so gate_ci.sh
          # falls back to the merge-base with the default branch.
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
          # Allowlist growth, from the same source as the mutation base. Without it gate_ci.sh
          # prints absolute sizes and never a delta, so the signal that exists to make a quietening
          # visible never fires. A report, never a gate.
          GUARD_SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/gate_ci.sh --full
