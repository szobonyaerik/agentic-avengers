name: pipeline-gates
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required — the mutation gate diff-scopes via `git merge-base HEAD <base>`,
      # and the default shallow clone has no merge-base, which silently falls back to mutating the
      # entire module-path (correct, but slow and it re-mutates every earlier phase).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools and project deps
        run: |
          pip install pytest cosmic-ray ruff
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f pyproject.toml ] && pip install -e . || true

      # Every check must prove it ran (issue #69). `prove` breaks each declared guard in a throwaway
      # copy and asserts its named tests go red - a guard that stays green is reported by name and
      # fails this step. `check` adds the diff-scoped half: a guard this PR ADDS to the enforcement
      # path with no inventory entry is a finding, while the guards it does not touch are counted
      # and named rather than blocking (the applicability boundary, CLAUDE.md 3a). The full audit,
      # which enforces the undeclared count over the whole tree, is `report` - run deliberately, and
      # nightly, never as a condition on somebody's unrelated PR.
      - name: Guard proof
        run: |
          set -euo pipefail
          python3 scripts/guard_proof.py prove --jobs 4
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            python3 scripts/guard_proof.py check --base "$BASE" --jobs 4
          else
            echo "no pull-request base: the diff-scoped half has no scope on a push build" >&2
          fi

      - name: Run pipeline gates (full)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GATE_PROVIDER: openrouter
          AUTHOR_FAMILY: anthropic
          # Mutation gate threshold. Override repo-wide with the MUTATION_MIN_SCORE variable.
          MUTATION_MIN_SCORE: ${{ vars.MUTATION_MIN_SCORE || '0.85' }}
          # Scope mutants to this PR's diff; on a push to main there is no PR base, so gate_ci.sh
          # falls back to the merge-base with the default branch.
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/gate_ci.sh --full
