[pytest]
# `subprocess` is the declaration scripts/subprocess_check.py looks for: a test that must drive a
# real process says so here, with a sentence saying why, and the check clears it. Registering it
# makes an unregistered spelling a visible warning rather than a silently ignored marker.
markers =
    subprocess(why): this test spawns a real process, for the stated reason. See scripts/subprocess_check.py.
