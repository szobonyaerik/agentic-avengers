# The pipeline's guard inventory - what each guard exists to catch, and how to break it.
#
# Issue #69 names the only test that says its class is fixed: pick any check in the pipeline, break
# the thing it guards, and confirm it goes red. A guard is not proven by passing. `tests/` being
# green proves the tests pass; it says nothing about whether any of them would notice the defect its
# guard was written for.
#
# So every guard here declares, in one place:
#   id          - how it is addressed on the command line and in the report
#   implements  - the file that decides. Also what diff-scoping asks about (CLAUDE.md 3a)
#   defect      - what it exists to catch, in one sentence, in the past tense where it really happened
#   tests       - the test(s) that MUST go red once the defect is back
#   [[guard.mutation]] - file / find / replace / count: the exact edit that reintroduces it
#
# `scripts/guard_proof.py` applies each mutation to a THROWAWAY COPY of the tree, runs the named
# tests and asserts they fail. It never writes inside this working tree. A mutation that leaves the
# tests green is reported `unproven` - a guard that does not guard. A mutation whose anchor is no
# longer in the file is reported `unanchored`, which is a finding too: the declaration drifted from
# the code and nothing was proved.
#
# The anchors are exact source text. When you change a guarded line, this file moves with it - that
# is the point. It is the one place where "this check works" is a claim something executes.
#
# [[exempt]] is the other half of the closed set: a file the enforcement surfaces invoke that decides
# nothing. Every entry needs a reason, and an exemption nothing invokes any more is itself a finding.

# --- carried items: a handover's forward-looking claims -------------------------------------------

