[[guard]]
id = "mutation-gate.a-corpse-is-not-a-live-worker"
implements = "scripts/hook_mutation.sh"
defect = "Liveness was decided by `kill -0`, which succeeds for a ZOMBIE: an entry in the process table that runs no code. After the SIGKILL, `wait` collects the leader this shell owns and the test-command process it spawned is reparented to PID 1 - cleared in milliseconds under launchd or systemd, NEVER cleared in a PID namespace whose PID 1 is an ordinary non-reaping process, which is what a plain `docker run` CI container is. The reap then reported a worker holding a tree nothing was holding, which produces the UNKNOWN state: the one this pipeline defines as `inspect the working tree by hand` and refuses to let GATE_BYPASS waive, over a tree the restore had proved intact."
tests = ["tests/test_hook_mutation.py"]
[[guard.mutation]]
