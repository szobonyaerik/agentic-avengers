# What a CLEAN result from each guard does NOT establish.
#
# Read by `scripts/guard_scope.py`, emitted by each guard on its own clean result, because a later
# stage reads OUTPUT and not source (issue #97). One file, not thirty-odd sentences at thirty-odd
# clean branches: a second statement of a fact drifts, and a stale scope statement is worse than
# none, since it is read as current.
#
# Each entry is keyed by the guard's FILE NAME and carries:
#   proves  - the positive claim a clean result supports, in one sentence ending in a full stop
#   limits  - what that clean result does NOT establish. At least one, always; a guard claiming no
#             limits is claiming total coverage, which is the assertion this file exists to stop
#             being made by silence.
#
# `guard_scope.py check` holds both ends: a declared guard with runtime output and no entry is a
# finding, and an entry no guard emits is a finding.

# --- the applicability boundary and the ledgers ---------------------------------------------------

[guard."applicability.py"]
proves = "that a rule bound only what this change is responsible for, and that every exception on a phase's ledger names one rule, one subject, a reason and an audited record."
limits = [
  "that an exception was JUSTIFIED - the ledger records a disclosure, it does not weigh one",
  "anything about findings outside the change's scope, which are counted and named rather than cleared",
  "anything at all when git could not say what changed: an unknowable scope enforces nothing",
]

[guard."amendments.py"]
proves = "that a post-verification change to a verified phase named the requirement ids it touched, and that a security amendment or one against an already-passing verdict is owed re-verification now rather than at the batch."
limits = [
  "that the ids named are the RIGHT ones - the naming is the author's claim, not a derivation from the diff",
  "that the re-verification the amendment owes has happened",
  "anything about a change for which nobody recorded an amendment at all",
]

[guard."measurement_claims.py"]
proves = "that every acceptance criterion in a spec still going through the gate names what it drives, that every finding in a verdict names its method, and that a universal claim on an amendment or a forward-claim row carries the set it was measured over."
limits = [
  "that what a `drives:`, `method` or `measured_over` field SAYS is adequate - presence is checked, never content; `drives: undriven (<why>)` and `method: read the source` both pass",
  "whether a universal claim's quantifier FITS its measured set - that comparison needs the set's members and the world, and it is the Verifier's",
  "WHICH universal claim a `measured_over` set covers: the field is per RECORD, not per claim, so a multi-KB amendment reason making five scope claims is cleared by naming one set",
  "a universal spelled outside the closed vocabulary: the set is pinned and deliberately small, so a synonym it does not know passes",
  "anything about a spec the gate already approved or an implementer has taken up, which is counted and named rather than held",
]

# --- phase obligations ----------------------------------------------------------------------------

[guard."breaker_gate.py"]
proves = "that every phase declaring `criticality: critical` carries a breaker.json naming what it attacked, or the counterexample it found."
limits = [
  "that the attack was adversarial, adequate, or aimed at the phase's real risk",
  "that the counterexamples found are all of them",
  "anything about a phase whose criticality is misdeclared, which owes no record here",
]

[guard."carried_items.py"]
proves = "that a card states what it carries or an explicit `none`, that every row on the prior card is answered, that each `built`/`tested` discharge names a requirement id or path that still resolves, and that every deferred finding has a record with an owner and a measurement behind its row and its `status: deferred` stamp."
limits = [
  "whether a claim NOBODY wrote down was worth carrying - silence is the state the original defect was written in",
  "a card that OVER-claims, asserting a protection its own phase deleted",
  "that a named test actually pins the claim it was named for; only that it exists",
  "that a deferred finding's measurement is TRUE or that the owner will fix it - only that it travels unchanged and the owner is asked",
]

[guard."done_when.py"]
proves = "that a finding against a requirement tagged with one of this phase's Done when conditions is refused deferral, that a Done when with no table, an uncarried condition or a tag naming no condition decides nothing rather than clearing, and that every condition declares whether a gate can evaluate it, with each `human-observed` one carried verbatim by a passing verdict and named on the card."
limits = [
  "that the requirements TAGGED are the right ones - the tagging is the spec writer's claim, gated with the spec, never derived from the prose",
  "anything about a finding with no requirement id - the id is the only mechanical link to a condition, and `--no-requirement` is the caller's explicit statement, not a check",
  "whether the prose Done when and the table agree - both are authored, and nothing reads the prose",
  "that a `gate-verifiable` declaration is TRUE - the row is taken at its word, so a visual condition declared gate-verifiable discloses nothing and this notices nothing; what is closed is the row that declares neither",
  "that any gate actually evaluates a `gate-verifiable` condition - the declaration says a gate CAN, never that one did",
  "anything about a Done when that is prose only, which stays UNDECIDABLE exactly as issue #115 left it, and anything about a plan this change does not write, which is counted and named",
]

[guard."verdict_currency.py"]
proves = "that the feature owes no amendment for production code committed after its newest verdict - the commit a landed verdict.json arrived in, or the head an open verdict's evidence was recorded at."
limits = [
  "WHICH phase owes the correction - the pipeline does not know which production file belongs to which phase",
  "an UNCOMMITTED edit made after the verification at the same head: it asks git what landed, and a working-tree change is not a landing",
  "anything when git cannot answer, or when no verdict is committed and no run recorded a head: it fails OPEN and says so, rather than passing invisibly",
  "anything about `docs/` or the feature's own e2e tree, which are excluded by design",
]

[guard."verifier_attempts.py"]
proves = "that no fourth verification attempt follows a failing verdict at the cap."
limits = [
  "that a route-back was BUNDLED rather than trickled - no script can know what a model could already see",
  "that carried findings were fixed: a waived remainder clears the cap by design, and `resolved` includes `carried`",
]

[guard."verifier_evidence.py"]
proves = "that the verdict's chain matches recorded runs whose logs hash to their stored digests, over specs and tests that have not changed since, each run naming the commit it stood on where git could say."
limits = [
  "that the tree the runs stood on is the tree that is here: the recorded head is an ANCHOR for verdict_currency, and production source is outside the subject digest by design",
  "that the runs were HONEST - there is no secret here, so an agent determined to fabricate a log and its digest still can",
  "that a committed log carries no secret: redaction is by pattern, a reduction of risk and never a guarantee",
  "anything about a phase outside the change's scope, which is counted and named rather than read for a verdict",
]

[guard."verifier_precheck.py"]
proves = "that every requirement id owed a trace has a row, that each row names a test which exists, is not skipped and (where the test lists any id) lists the row's id, that every spec's gate stamp is fresh, that every bound `done` stamp still names the mapping and tests here now, that every Done when condition in scope declares whether a gate can evaluate it with a passing verdict carrying the ones no gate can, and that a passing verdict's recorded `suite` run is the test command the project declares."
limits = [
  "that a row's PROSE matches the test it names - a row asserting the opposite of its own running test passes",
  "a row whose test lists NO requirement id, which can corroborate nothing and is counted rather than held",
  "a `done` stamp carrying no digest - stamped before the rule, or through a write no hook sees - which is counted rather than held",
  "anything about a test tree it cannot read: definition and skip detection are Python-specific, and an unreadable tree is not held at all",
  "anything about coverage or correctness, which it deliberately never judges",
  "whether a Done when condition declared `gate-verifiable` really is one - it refuses the row that declares neither, never a wrong declaration",
  "that a CARRIED spec's mapping is the right one: a spec directory of that name under this feature is taken to be the same spec, and its rows count toward the traced set only - never toward the row-to-test check, which is held against this phase's own tests",
  "anything about no-mistakes' own feature-close `test` step: it reads the declared command out of `.no-mistakes.yaml` and the RUN out of the transcript this pipeline writes, so a project whose config no-mistakes could not see (it reads `main` regardless of the default branch) still improvises there and this says nothing about it - that half is upstream",
  "that two SPELLINGS of one command are the same command: the comparison is a prefix over the argv, so `python3 -m pytest --cov` and the declared flags in another order are both refused, which is the safe direction and is named in the finding rather than resolved",
  "that the declared command is the RIGHT one, or that it was read from a real YAML parse: these scripts are stdlib-only, so the `test:` key is read by line and two disagreeing declarations are reported UNDECIDABLE rather than resolved",
]

[guard."pipeline_metrics.py"]
proves = "that a phase's measurements were offered to the record at the moment the stage concluded them, and that a close was refused until the phase actually landed - its contract card committed and nothing under it uncommitted."
limits = [
  "that anything was WRITTEN: every command here except `defect` is fail-open by design, so a clean exit means the emission was attempted, never that the record changed - `provenance <phase>` is what reads back what the pipeline actually stamped",
  "that a fact no stage emits was measured at all - it records what it is handed, and the implementer's own catches reach it through no route",
  "that a stamped number is RIGHT: it derives `verification_attempts` from the verdict record and the suite size from a collection, and a wrong artifact yields a wrong stamp",
  "anything about a phase whose trigger never fired - a spec authored through a heredoc opens no phase, and its `elapsed_minutes` stays null and is said rather than invented",
  "that a scalar `provenance` credits to the pipeline still HOLDS the value the pipeline stamped: the row records field NAMES only, so the pipeline stamps `tests_after=100` and names it, the close seals the record, an operator later corrects it to 128 through firstmate's own CLI, and `provenance_report` goes on counting it under `scalars_by_pipeline` at `fraction_by_pipeline: 1.0`. The row is names-only on purpose - values beside the record would be a second copy of a record firstmate owns, against its closed schema - so this is a declared limit, not a defect awaiting a fix",
]

[guard."emission_gate.py"]
proves = "that a closing phase records at least as many defects as its own verdicts and its Breaker record describe, and that a landed phase carries a close stamp."
limits = [
  "any defect described only in a PR body, a status log, a chat transcript or a commit message - it reads the Verifier's `findings[]` and the Breaker's `counterexamples[]` and nothing else",
  "the spec gate's, mutation's and the implementer's conclusions, none of which are compared to the record here (the first two have their own emission, the implementer has none)",
  "equality: one finding may describe two defects and still pass. This is a floor",
  "whether the close stamp was taken at the right moment - only that a landed phase carries one",
]

# --- the spec wall ---------------------------------------------------------------------------------

[guard."spec_gate_triage.py"]
proves = "that the verdict was derived by arithmetic from a CLOSED blocking set, with no model deciding it and no invented category surviving."
limits = [
  "anything about observations the observe pass never made - it classifies what it was given",
  "that a note is harmless: a note is an UNBLOCKED finding, not a non-issue",
]

[guard."spec_gate_context.py"]
proves = "that the contracts block the reviewer reads is present, or that its degradation is announced inside the block the reviewer actually receives."
limits = [
  "a heading present with genuinely nothing under it, which is ordinary early-planning absence and not degradation",
  "whether the spec CONTRADICTS the contracts it carries - it assembles the block and never judges against it",
]

[guard."spec_gate_state.py"]
proves = "that a spec reading `approved` carries the one machine gate's stamp AND that its body still hashes to the bytes that stamp was written over - an edited body reads `stale`, never `approved`."
limits = [
  "that the approval was RIGHT - it reads a stamp and a hash, it does not review a spec",
  "anything about a body no gate ever hashed: an UNRECORDED stamp stays `approved` on the applicability boundary, and the CLI says so on stderr",
  "the human sign-off (`review_status`), which is a separate question this never reads",
]

[guard."spec_rubric.py"]
proves = "that the writer's brief rendered whole, derived line by line from the gate's own sources - the blocking table the verdict comes from, the requirement counter, the criterion field the gate checks, and the two prompt sections lifted verbatim."
limits = [
  "that the writer READ it: delivery is a `SubagentStart` injection, and a runtime without that event renders the brief from a pointer instead",
  "that a spec written after reading it will pass - the brief carries the criteria, not a verdict",
  "anything about the gate's own model passes, which this only quotes",
  "that the rules it renders are RIGHT: it is a faithful render of `spec_gate_triage.BLOCKING`, `requirement_cap` and `measurement_claims`, so a defect in any of those is reproduced here rather than caught",
]

[guard."spec_gate_cache.py"]
proves = "that an already-approved body is not re-judged, and that a rejection never becomes the approved reference."
limits = [
  "that the approval it replays was RIGHT - it hashes a body, it does not review one",
  "anything about a change confined to workflow bookkeeping, which by construction cannot move a verdict",
]

[guard."requirement_cap.py"]
proves = "that a spec still open declares no more requirements than the cap."
limits = [
  "anything about a shipped spec, which is counted and named because the SPLIT remedy does not exist for it",
  "a layout the parser cannot read, which is UNDECIDABLE and never reported as within the cap",
  "whether the requirements are the RIGHT ones - it counts declarations",
]

[guard."spec_done_guard.py"]
proves = "that a stamp newly written into `status: done` is backed by a real mapping row and a green phase suite, is reverted when it is not, and once it stands is bound to the bytes of its mapping and its own tests."
limits = [
  "a stamp written through Bash (`sed -i`, a heredoc, `python3 -c`): this is a PostToolUse hook and only tool writes reach it, so such a stamp is bound to nothing and is counted, not held",
  "the tests of a spec with no per-spec test directory: there the digest covers the mapping alone, and `bind` says so",
  "a spec already `done` at HEAD, which has shipped and is never rewritten",
  "any of the pipeline's other stamps - it binds `status: done` and does not generalise",
]

# --- the read path and the documents --------------------------------------------------------------

[guard."phase_artifacts.py"]
proves = "that every phase whose specs are all stamped `status: done` has a `test-mapping.md` for each spec that owes one - beside the spec, or, for a spec carried in from another phase of the same feature, in the phase that implemented it."
limits = [
  "anything about the CONTENT of a mapping: presence is read, never rows, and `spec_done_guard.py` holds that at the stamp",
  "anything about a phase's handover, verdict, evidence or Breaker record - every one of those belongs to hook_verifier.sh, and a second weaker copy of a rule is the drift defect",
  "that a carried spec's mapping is the RIGHT one: a spec directory of that name under this feature is taken to be the same spec",
  "that a phase abandoned mid-verification is distinguishable from one still being verified",
  "anything about a phase this change did not touch, which is counted and named through the applicability boundary",
]

[guard."doc_read_path.py"]
proves = "that artifacts in scope declare their readers, that a contract card stays under its byte cap, and that no stage instruction re-acquired a read the table removed."
limits = [
  "a stage instructed to read something the table never declared - the source check is ONE-DIRECTIONAL",
  "a claim that is wrong in both the table and the source it is held against: `--contract` compares the two, so a defect shared by both sides is outside what it can see",
  "a document class named only as a bare filename in prose, which it cannot see",
  "anything downstream: in a repository that merely installed the pipeline neither direction of `--contract` runs, and it says so",
]

[guard."interface_drift.py"]
proves = "that every call signature a spec's Interfaces block NAMES exists somewhere in the source tree."
limits = [
  "order of operations - the instance this was written for is invisible to it, since both names exist",
  "behaviour, schemas and error modes: a function that exists and does the opposite passes",
  "a dotted call into a dependency, which is skipped, and a block written as pure prose, which names nothing",
  "that a definition is in the right place - a call site counts as an existence proof",
]

[guard."behaviour_drift.py"]
proves = "that in a phase whose specs declare `work_kind: migration` or `refactor`, every literal, operator and control-flow edge that changed against the base - definition by definition, after cancelling moves, extractions and inlinings - cites a requirement the phase declares or a disclosed exception."
limits = [
  "a MOVE: a block cut here and pasted there cancels when the two read alike, down to a single atom moving with its line - swapping two whole branches is a move",
  "BOTH HALVES of a change inside one definition: an atom removed and an identical atom added there cancel, so the change still blocks on its other half but the pair is not shown",
  "a change carried entirely by identifiers: call targets, argument order and attribute names are what a rename may change, so `fetch(a, b)` becoming `fetch(b, a)` passes",
  "that a cited change is CORRECT or that an uncited-looking one is wrong - it asks for a citation, it does not prove or refute equivalence",
  "anything that is not Python, which is counted and named rather than parsed - a `.ts`/`.js` phase is cleared by nothing here",
  "WHICH removal a standalone citation meant: a `# behaviour:` comment on its own line clears every removal in its definition, because a deleted statement leaves no line to attach one to",
  "in session, anything the phase committed before its close: the comparison is against HEAD unless BEHAVIOUR_BASE names the phase's base",
]

[guard."fixture_shapes.py"]
proves = "that every literal fixture in scope satisfies the shapes the project declared for it."
limits = [
  "that a declaration is MISSING - an identifier nobody declared is not checked, and guessing a shape would be worse than not checking",
  "a computed fixture: only literals are judged",
  "the overflow itself - it reads fixtures, not columns, and a project with no declaration is clean because nothing was compared",
]

# --- cost, lint and process -------------------------------------------------------------------------

[guard."subprocess_check.py"]
proves = "that every spawner reachable through an import alias or a declared attribute chain, in the files in scope, carries a justification."
limits = [
  "a spawner reached through an OBJECT (`self.runner.run(...)`) or a name assembled at runtime, which resolve to no module this owns",
  "a process spawned from a non-Python helper the scan never reads",
  "anything about files out of the diff's scope, or about a project whose test root is not where it looked",
  "cost in wall clock: it counts spawners deliberately, because a runtime budget failed green suites at random",
]

[guard."lint_gate.py"]
proves = "that ruff's DECLARED rule set passes, and that the files this change touched are formatted."
limits = [
  "any rule the repository did not enable - the verdict is against `ruff.toml`, not against ruff's defaults",
  "formatting of files this change did not touch, which are counted and named",
  "anything at all when ruff is absent, which is recorded as a failed check and never as clean code",
]

[guard."suite_outcome.py"]
proves = "that a suite run backing a pass exited on its own and printed a runner summary."
limits = [
  "whether that suite was GREEN - it decides RAN versus STOPPED, and nothing else",
  "a runner whose summary shape nobody declared, which is not held",
]

[guard."implementer_liveness.py"]
proves = "that no second implementer was spawned into a working copy already holding a live one - a start with no SubagentStop, no harness-reported TaskStop, and a harness process the kernel still knows."
limits = [
  "anything that is not a verdict - no jq, no python3, an unreadable payload or no activity log lets the spawn through and says so",
  "a stage started any way other than the spawn tool this hook sees",
  "what a live implementer is DOING: only that it started and has not stopped",
  "an agent that died inside a harness still alive without a TaskStop - a crash, an interrupt - which only the age ceiling bounds",
  "a start row written before harness pids were recorded, which the process check cannot see and judges by the ceiling alone",
]

# --- the gates' own machinery -----------------------------------------------------------------------

[guard."gate_runner.py"]
proves = "that the verdict came from a resolvable model of a declared family over a named transport, inside its budget, with the call and any failure cause recorded - an empty reply named as empty, a call still running at the budget named as a timeout."
limits = [
  "that the verdict is CORRECT - this is transport and attribution, never review",
  "cross-family independence when a same-family waiver is in force: that is an audited override, not a gate that passed",
  "anything an attribution recorded as `unrecorded` would have named",
]

[guard."gate_plausibility.py"]
proves = "that a reached verdict took at least the minimum wall clock a real provider call needs."
limits = [
  "that a call above the floor did any reasoning - it refuses the impossible, it does not certify the plausible",
  "any refusal that never reached a provider, which records its near-zero latency on purpose",
  "anything when the floor is set to 0, which disables it and says so on every call",
]

[guard."gate_timeouts.py"]
proves = "that a hook's configured budget exceeds the calls it must contain, plus headroom for what measurement spends inside it."
limits = [
  "anything about a REAL run - this is an arithmetic relation between declared numbers, never an observation",
  "a runner invoked inside a loop, which it cannot count",
]

[guard."model_vendors.py"]
proves = "that a model id resolves to exactly one known vendor family, and that an unknown vendor is a loud refusal."
limits = [
  "that two DIFFERENT families do not share a blind spot, which is the whole reason cross-family is asked for",
  "anything about a model whose id nobody mapped",
]

[guard."mutation_score.py"]
proves = "that the killed fraction of the mutants actually built and tested met the threshold."
limits = [
  "anything about mutants the scope filter never ran - they are excluded from the denominator, not passed",
  "that no survivor exists: the threshold is deliberately not 100%, so a passing score still leaves behaviours no test catches",
  "that the suite has no gamed tests - this is partial cover and there is no dedicated reader",
]

[guard."mutation_scope.py"]
proves = "that at least one mutant lies on a line this change is responsible for, counting modified, staged AND untracked files."
limits = [
  "anything about code the change did not touch, which is out of scope by design",
  "a defect no mutation operator generates a mutant for",
  "whether the suite KILLS what remains in scope, which is the scorer's question and not this one's",
]

[guard."mutation_exec_guard.py"]
proves = "that every file the cosmic-ray session could write hashes exactly as it did before exec - and was put back from the pre-exec snapshot where it did not - and that exec was not started when the baseline's measured wall clock times the pending mutants would not fit the hook's remaining budget."
limits = [
  "WHO changed a differing file - a test command that rewrites source under module-path reads as corruption, since only the bytes are compared",
  "that exec will finish: the budget estimate is a LOWER bound, a hung mutant runs to cosmic-ray's own timeout, which is why the restore also runs on the kill path",
  "anything at all when the hook ITSELF is SIGKILLed before the restore - no code is left to run there",
  "the index: `git status --porcelain` is recorded and shown, never compared, because an implementer may legitimately stage a file under a running hook",
]

[guard."plugin_release.py"]
proves = "that the plugin copy executing right now hashes identical to the source repository's committed HEAD."
limits = [
  "anything when no source repository is resolvable: UNKNOWN is reported and never enforced",
  "behaviour - it compares shipped CONTENT, so an in-progress edit reads as `dirty` rather than stale",
  "a defect present in BOTH the release and the source it is compared against: this is a two-sided comparison, so a bug the source repository also carries reads as perfectly fresh",
]

[guard."required_skills.py"]
proves = "that every skill a stage's own `Required skills` line names has an observed load recorded for it, and that every canonical agent's line names the shared-rules skill at all."
limits = [
  "a skill an agent names only in PROSE, which is not a requirement",
  "that the shared-rules skill's CONTENT still carries the rule a caller expects of it - the requirement is checked, never what is in the file",
  "that the stage READ what it loaded, or acted on it",
  "the ponytail ladder, which is evidenced but deliberately never required, so its absence is a NOTE and never a gap",
]

[guard."stage_effort.py"]
proves = "that every stage declares an effort where the harness reads it, and that no document states a level the definitions do not."
limits = [
  "what any stage actually RAN at - a declared effort is not an observed one, and no retrospective may read this as a measurement",
  "a model silently downgraded because it does not support a level, which only the harness sees",
  "a level that is WRONG in both the definitions and the documents: this compares the two, so a defect shared by both sides is outside what it can see",
]

[guard."guard_proof.py"]
proves = "that a named test set NOTICES a named defect, and that every file the enforcement surfaces invoke is declared or exempt."
limits = [
  "that the guard is CORRECT, or that its declared mutation is the only route back to the defect - one hole, closed",
  "a check that is neither declared NOR invoked from an enforcement surface, which is invisible to a harness that discovers guards by what the pipeline runs",
  "anything about guards outside the change's scope, which are counted by name",
  "that EVERY guard emits its scope statement: `scope` names each declared emission exception beside its own clean line, and a guard listed there emits nowhere a later stage reads",
]

# --- the shell guards --------------------------------------------------------------------------------

[guard."guard_scope.py"]
proves = "that every guard with runtime output declares what a clean result does not establish, and emits it."
limits = [
  "that a declared limit is COMPLETE or accurate - it holds a statement against a guard, never a statement against reality",
  "anything downstream: `guards.toml` is not vendored, so outside this repository the check does not run and says so rather than half-running",
  "anything about a guard that is neither declared in guards.toml nor invoked from an enforcement surface",
  "that the emission is REACHED at runtime: the call is found in the SOURCE, so one on a branch nothing executes counts, and one assembled at runtime does not",
  "that every guard emits: a declared exception is skipped here and named beside the clean result instead",
  "an allowlist that was already too wide at the comparison base: `allowlists` reports GROWTH against a base, so a defect present on both sides of the comparison is outside what it can see",
  "anything a shell guard spells indirectly - that half is a text match over uncommented lines, so an invocation built from a variable is invisible to it",
]

[guard."hook_spec_gate.sh"]
proves = "that this spec write cleared every mechanical check the gate owns - undeclared subprocess spawners, the requirement cap, an acceptance criterion naming nothing it drives - and then that a cross-family observe-plus-triage pass derived APPROVED from the closed blocking set."
limits = [
  "that the spec is GOOD: the blocking set is closed on purpose, so everything the observe pass saw outside it is a note that blocked nothing and lands in `spec-notes.md`",
  "that a `drives:` field is ADEQUATE - presence is checked, never content, and `drives: undriven (<why>)` passes by design (issue #116 owns what that declaration must carry)",
  "anything about a spec written outside this hook's trigger: a body authored through a shell heredoc fires no gate at all and has zero rounds, not a passing one",
  "that the CONTEXT the observe pass read was complete - a degraded or unavailable context block is banner-ed into the report and never fails the gate",
  "that the human half of the wall ran: `review_status` is a separate sign-off, and under SPEC_REVIEW_MODE=auto this gate is the whole wall because nobody is there",
]

[guard."hook_verifier.sh"]
proves = "that at this phase's handover every precheck, required-skill audit, execution-evidence record, verdict-currency check, Breaker obligation, carried-items row, amendment and defect emission was asked for and answered, that verdict.json reads `pass`, and that a `done` stamp it let stand was bound to the bytes it checked."
limits = [
  "that the VERDICT is right - this hook checks that the Verifier's artifact exists, is fresh, still describes the committed tree, and passes; no model runs here and the judging happens in chat",
  "anything about a phase whose trigger never fired: this is a PostToolUse hook on a spec stamp and a handover write, so work landed any other way is unseen",
  "that the phase is free of defects - it holds a floor on what was RECORDED, never a ceiling on what exists",
]

[guard."pipeline_init.py"]
proves = "what state a repository is actually in before `/pipeline-init` writes anything - which files it already owns, and which the pipeline still owes it."
limits = [
  "nothing at all about correctness: this is a REPORT and always exits 0, because a non-greenfield repository is a normal repository and not a defect",
  "that a file it found is USABLE - it reads presence, never content or fitness for the step that will consume it",
  "that acting on the survey is safe: what the command then does with this answer is the command's decision, not this one's",
]

[guard."env_assemble.py"]
proves = "that a project `.env` was assembled with every key on its own line, and that no placeholder value survived into a run."
limits = [
  "that the VALUES are right - it refuses a placeholder and a fused key, and cannot tell a wrong-but-plausible setting from a correct one",
  "anything about a key the templates do not carry, or about a `.env` edited by hand after assembly",
  "that the assembled configuration suits this project: it guarantees the SHAPE of the file, never its meaning",
]

[guard."gate_ci.sh"]
proves = "that every gate on this floor which could run, ran and passed - the artifact checks, the cross-family assertion, lint in both dimensions, the suite, and under --full the mutation gate."
limits = [
  "any step that was SKIPPED rather than run: the --full-only checks, a mutation gate with no config, and every step that said NOT CHECKED are not part of this pass",
  "that the mutation gate MEASURED anything: with no comparison base resolvable it reports `did-not-run` and is counted rather than blocking, even under enforce, because no remedy exists there (CLAUDE.md 3a)",
  "anything a model judges - no model runs here by design; the spec gate and the Verifier are in chat",
  "that the suite is adequate: a green suite proves the tests pass, never that any of them would notice the defect its guard exists for",
  "that the announced interpreter is the project's intended one: the suite runs under the same python3 as every other check here, and that path is printed, not checked against a declaration",
]

[guard."hook_mutation.sh"]
proves = "that the mutation gate ran over the phase's own changed lines, or that its absence was recorded as `did-not-run` where a later reader looks."
limits = [
  "that a passing score is a quality bar: advisory never blocks, and that is a decision rather than a defect",
  "that survivors above the threshold are harmless - each is still a behaviour no test catches",
  "anything about tests written to pass rather than to discriminate, for which there is no dedicated reader",
]

[guard."hook_phase_close.sh"]
proves = "that every phase directory the commit just made touched was offered to `phase-close`, so the close stamp is taken at landing by something that executes rather than by an orchestrator remembering to."
limits = [
  "that any stamp was actually WRITTEN: `record_phase_close` decides landing and refuses a phase whose contract card is not committed, and the metrics writer is fail-open throughout - this hook offers the phase and never claims the record changed",
  "a commit made outside a Bash tool call, which reaches no PostToolUse hook at all",
  "anything when `jq`, the payload or the repository could not be read: each exits 0 having stamped nothing, and the close is then owed to the orchestrator's own `phase-close`",
  "that the measurements the stamp carries are right - only when they were taken",
]

[guard."hook_activity.sh"]
proves = "that a TaskStop row in .agent-activity.jsonl records a stop the harness itself reported as successful, never a TaskStop that was merely attempted."
limits = [
  "a stop performed any way the harness reports through no tool response - a crash, an interrupt, a session that died",
  "the harness pid a start row carries: recorded from this hook's own ancestry and checked by implementer_liveness.py, never verified here",
  "anything on a recorded row, which is this hook's clean result and deliberately carries no statement: it prints nothing by contract (a declared exception in `guard_proof.EMISSION_EXCEPTIONS`)",
]

[guard."hook_implementer_lock.sh"]
proves = "that no second implementer was spawned into a working copy already holding a live one."
limits = [
  "anything that is not a verdict - an unreadable payload, a missing interpreter or an unusable pattern lets the spawn through and says so",
  "a crashed agent past its age-out, whose lock is deliberately released rather than held forever",
  "a lock cleared under GATE_BYPASS_GATES=implementer-lock, which is an audited override and not a check that passed",
]

[guard."hook_plugin_release.sh"]
proves = "that no avenger stage was spawned while the executing plugin copy is STALE against its source repository."
limits = [
  "anything when the checker could not run: every non-verdict fails OPEN and says so, because `cut a release` is the wrong remedy for a crash",
  "an UNKNOWN release state, which is reported and never enforced",
]

[guard."hook_autoapprove.sh"]
proves = "that while auto is armed, a command matching the hard-deny set was refused."
limits = [
  "intent: the regex matches the whole command STRING, so free text that merely NAMES a denied command is denied too, and prose belongs in a file the command reads",
  "a command spelled a way the pattern does not cover",
  "anything on an ALLOW, which is this guard's clean result and deliberately carries no statement: it is emitted per tool call and would bury every other line, so this rides the deny (a declared exception in `guard_proof.EMISSION_EXCEPTIONS`)",
]

[guard."test_root_args.sh"]
proves = "that the pytest arguments a gate runs were assembled from the project's own declared test roots, each minus its own `e2e/`, with every root and `--ignore=` passed as one argument, and that a run which fell back to the whole tree said which of the two causes put it there."
limits = [
  "that the declared roots are the RIGHT ones - it translates a declaration, it never judges one",
  "that anything was TESTED: it builds an argument list, and what a red suite means is the caller's verdict",
  "that a root it skipped is absent for a good reason - a root that does not exist on disk is left out so pytest is not handed a usage error, whether the project has no tests yet or the declaration is wrong",
]

[guard."bypass_log.sh"]
proves = "that an override reached `gate-overrides.log` as one normalised, tab-separated record, or was not recorded at all."
limits = [
  "whether the override was WARRANTED - it records a disclosure and never weighs one",
  "that anybody reads the log: an audited bypass nobody reviews is still an unreviewed bypass",
]

# --- allowlists: growth is a signal, never routine maintenance ------------------------------------
#
# A drift guard was once quietened with NINE allowlist entries instead of a fix to its extraction
# layer (issue #97). Any allowlist-based guard invites exactly that, because adding an entry looks
# like maintenance and reads as one line of diff. These are counted and their growth is REPORTED -
# deliberately not gated, because growth is often legitimate and a blocking check would be answered
# with a bypass rather than with a reviewer's attention, which is the whole thing being bought.

[[allowlist]]
id = "guard-exemptions"
file = "scripts/guards.toml"
marker = "[[exempt]]"
guard = "guard_proof.py"
what = "files an enforcement surface invokes that are declared to decide nothing"

[[allowlist]]
id = "subprocess-declarations"
glob = "tests/**/*.py"
# The guard's own test corpus carries this marker as FIXTURE SOURCE inside synthetic modules under
# test, not as a declaration by any test. Counted, it inflated the reported size and made any edit
# to that corpus read as ALLOWLIST GREW - noise in the one signal this is meant to buy attention for.
exclude = ["tests/test_subprocess_check.py"]
marker = "pytest.mark.subprocess"
guard = "subprocess_check.py"
what = "tests declared to need a real process"

[[allowlist]]
id = "read-path-named-only-by"
file = "scripts/doc_read_path.py"
marker = "named_only_by"
guard = "doc_read_path.py"
what = "stage instructions permitted to name a document that left the read path"

# --- a helper agent is bounded (issue #118) -------------------------------------------------------

[guard."helper_budget.py"]
proves = "that this helper dispatch declared a budget within the ceiling, and that no helper already running under a declared budget of its own has passed it."
limits = [
  "whether the question being delegated has a ONE-COMMAND ANSWER, which is the rule's first half and a judgement no static check makes - it is carried by skills/pipeline-conventions, which every stage is required to load",
  "that an overrunning helper was actually ABANDONED: the harness exposes no timeout on a delegation and fires no event inside a blocked parent, so what is mechanised is that the NEXT dispatch cannot proceed over the top of it",
  "that the declared budget is the RIGHT one - the number is the author's claim, bounded only by HELPER_BUDGET_MAX_S",
  "any live helper at all when there is no activity log to read, which outside a pipeline run is ordinary: that half is reported as not run and never as clear",
  "a helper with no paired dispatch row - spawned before this rule or under HELPER_BUDGET_OFF=1 - which has no declared budget and is deliberately left unjudged rather than judged against an invented one",
  "a helper older than the liveness age ceiling (IMPLEMENTER_MAX_AGE_S, four hours), which is presumed dead so that a crashed agent cannot hold a refusal forever",
]

[guard."hook_helper_budget.sh"]
proves = "that no helper agent was spawned without a declared budget, or on top of one already past its own."
limits = [
  "anything that is not a verdict - no python3, an unreadable payload or an unusable HELPER_AGENTS pattern lets the spawn through and says so",
  "an `avenger-*` pipeline stage, which is the chain rather than an ad-hoc helper and is deliberately not bound",
  "a dispatch waived under GATE_BYPASS_GATES=helper-budget, which is an audited override and not a check that passed",
]
